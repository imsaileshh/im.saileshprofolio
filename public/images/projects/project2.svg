<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1B19" />
      <stop offset="100%" stop-color="#141312" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg2)" />
  
  <!-- Canvas Frame -->
  <g transform="translate(80, 70)">
    <rect width="1040" height="610" rx="6" fill="#242220" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="1040" height="48" rx="6" fill="#1A1918" />
    <circle cx="28" cy="24" r="5" fill="#E05B4C" />
    <circle cx="46" cy="24" r="5" fill="#E5A642" />
    <circle cx="64" cy="24" r="5" fill="#57A773" />
    <text x="520" y="29" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1.5">KROMA // DESIGN TOKEN STUDIO</text>
    
    <!-- UI Component Sandbox Matrix -->
    <g transform="translate(40, 75)">
      <!-- Component 1: Button tokens -->
      <rect width="460" height="230" rx="4" fill="#1C1B1A" stroke="rgba(255,255,255,0.05)" />
      <text x="24" y="36" fill="#FAF8F3" font-family="sans-serif" font-size="14" font-weight="600">Button Primitive Tokens</text>
      <text x="436" y="36" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">FIG. 02A</text>
      
      <g transform="translate(24, 60)">
        <!-- Button primary -->
        <rect width="120" height="38" rx="2" fill="#FAF8F3" />
        <text x="60" y="24" fill="#1C1917" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">PRIMARY</text>
        
        <!-- Button secondary -->
        <rect x="135" width="120" height="38" rx="2" fill="#2E2C2A" stroke="rgba(255,255,255,0.15)" />
        <text x="195" y="24" fill="#FAF8F3" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">SECONDARY</text>

        <!-- Button ghost -->
        <rect x="270" width="120" height="38" rx="2" fill="none" stroke="#A8462D" stroke-width="1.5" />
        <text x="330" y="24" fill="#A8462D" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">DESTRUCT</text>
      </g>

      <!-- Token code snippet -->
      <g transform="translate(24, 125)">
        <rect width="412" height="85" rx="3" fill="#141312" />
        <text x="16" y="26" fill="#A68020" font-family="monospace" font-size="11">const button = cva('inline-flex items-center', {</text>
        <text x="32" y="46" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="11">variants: { intent: { primary: 'bg-ink text-paper' } },</text>
        <text x="32" y="66" fill="#388A9E" font-family="monospace" font-size="11">defaultVariants: { size: 'sm', elevation: 'tactile' }</text>
      </g>

      <!-- Component 2: Color Palette Tokens -->
      <g transform="translate(500, 0)">
        <rect width="460" height="230" rx="4" fill="#1C1B1A" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="36" fill="#FAF8F3" font-family="sans-serif" font-size="14" font-weight="600">Archival Swatch Palette</text>
        <text x="436" y="36" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">TOKENS 02B</text>

        <g transform="translate(24, 60)">
          <!-- Swatches -->
          <rect width="76" height="60" rx="2" fill="#F5F1E8" />
          <text x="38" y="80" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="middle">#F5F1E8</text>

          <rect x="84" width="76" height="60" rx="2" fill="#EAE5D9" />
          <text x="122" y="80" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="middle">#EAE5D9</text>

          <rect x="168" width="76" height="60" rx="2" fill="#A68020" />
          <text x="206" y="80" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="middle">#A68020</text>

          <rect x="252" width="76" height="60" rx="2" fill="#31648E" />
          <text x="290" y="80" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="middle">#31648E</text>

          <rect x="336" width="76" height="60" rx="2" fill="#1C1917" stroke="rgba(255,255,255,0.2)" />
          <text x="374" y="80" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="9" text-anchor="middle">#1C1917</text>
        </g>
        
        <g transform="translate(24, 160)">
          <rect width="412" height="50" rx="3" fill="#141312" />
          <text x="16" y="30" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="11">WCAG 2.2 AAA Contrast Compliance: <tspan fill="#57A773" font-weight="bold">PASS (14.2:1)</tspan></text>
        </g>
      </g>

      <!-- Bottom Interactive Grid Showcase -->
      <g transform="translate(0, 250)">
        <rect width="960" height="240" rx="4" fill="#1A1918" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="36" fill="#FAF8F3" font-family="sans-serif" font-size="14" font-weight="600">Storybook Component Workbench</text>
        
        <!-- Cards grid -->
        <g transform="translate(24, 60)">
          <rect width="216" height="150" rx="3" fill="#22211F" stroke="rgba(255,255,255,0.08)" />
          <text x="16" y="32" fill="#FAF8F3" font-family="sans-serif" font-size="13" font-weight="600">Modal Layer</text>
          <rect x="16" y="50" width="184" height="60" rx="2" fill="#171615" />
          <text x="108" y="85" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" text-anchor="middle">&lt;Dialog /&gt;</text>
          <text x="16" y="132" fill="#388A9E" font-family="monospace" font-size="9">PROP: accessible=true</text>

          <rect x="238" width="216" height="150" rx="3" fill="#22211F" stroke="rgba(255,255,255,0.08)" />
          <text x="254" y="32" fill="#FAF8F3" font-family="sans-serif" font-size="13" font-weight="600">Data Table</text>
          <rect x="254" y="50" width="184" height="60" rx="2" fill="#171615" />
          <text x="346" y="85" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" text-anchor="middle">&lt;VirtualGrid /&gt;</text>
          <text x="254" y="132" fill="#57A773" font-family="monospace" font-size="9">VIRTUAL: 100k rows</text>

          <rect x="476" width="216" height="150" rx="3" fill="#22211F" stroke="rgba(255,255,255,0.08)" />
          <text x="492" y="32" fill="#FAF8F3" font-family="sans-serif" font-size="13" font-weight="600">Toast Engine</text>
          <rect x="492" y="50" width="184" height="60" rx="2" fill="#171615" />
          <text x="584" y="85" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" text-anchor="middle">&lt;SonnerToast /&gt;</text>
          <text x="492" y="132" fill="#A68020" font-family="monospace" font-size="9">ANIM: spring(0.85)</text>

          <rect x="714" width="222" height="150" rx="3" fill="#22211F" stroke="rgba(255,255,255,0.08)" />
          <text x="730" y="32" fill="#FAF8F3" font-family="sans-serif" font-size="13" font-weight="600">Form System</text>
          <rect x="730" y="50" width="190" height="60" rx="2" fill="#171615" />
          <text x="825" y="85" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" text-anchor="middle">&lt;SchemaForm /&gt;</text>
          <text x="730" y="132" fill="#B84F38" font-family="monospace" font-size="9">ZOD: schema-valid</text>
        </g>
      </g>
    </g>
  </g>
</svg>
