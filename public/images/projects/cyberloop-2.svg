<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181816" />
      <stop offset="100%" stop-color="#1F1E1C" />
    </linearGradient>
  </defs>
  <rect width="700" height="800" fill="url(#cbg2)" />
  <g transform="translate(40, 40)">
    <!-- Header -->
    <rect width="620" height="720" rx="4" fill="#242220" stroke="rgba(255,255,255,0.08)" />
    <rect width="620" height="48" rx="4" fill="#1C1B1A" />
    <circle cx="24" cy="24" r="4" fill="#E05B4C" />
    <circle cx="40" cy="24" r="4" fill="#E5A642" />
    <circle cx="56" cy="24" r="4" fill="#57A773" />
    <text x="310" y="29" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" text-anchor="middle">SLA_AUTOMATION_RULES // WORKFLOW</text>

    <!-- Content -->
    <g transform="translate(30, 75)">
      <text x="0" y="20" fill="#FAF8F3" font-family="sans-serif" font-size="15" font-weight="bold">Trigger: P0 Priority Escalation</text>
      <text x="0" y="42" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">CONDITION: response_time &gt; 90s</text>

      <!-- Flow nodes -->
      <g transform="translate(0, 70)">
        <rect width="560" height="90" rx="3" fill="#1C1B1A" stroke="#A68020" stroke-width="1.5" />
        <text x="20" y="32" fill="#A68020" font-family="monospace" font-size="10">STEP 01 — CLUSTER RE-ROUTE</text>
        <text x="20" y="60" fill="#FAF8F3" font-family="sans-serif" font-size="14">Assign to Tier-3 Incident Response Squad</text>
        <text x="540" y="48" fill="#57A773" font-family="monospace" font-size="11" text-anchor="end">AUTO-ASSIGNED</text>
      </g>

      <line x1="280" y1="160" x2="280" y2="190" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4" />

      <g transform="translate(0, 190)">
        <rect width="560" height="90" rx="3" fill="#1C1B1A" stroke="rgba(255,255,255,0.1)" />
        <text x="20" y="32" fill="#388A9E" font-family="monospace" font-size="10">STEP 02 — PAGER NOTIFICATION</text>
        <text x="20" y="60" fill="#FAF8F3" font-family="sans-serif" font-size="14">Broadcast Slack #war-room + SMS Alert</text>
        <text x="540" y="48" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" text-anchor="end">LATENCY: 0.12s</text>
      </g>

      <line x1="280" y1="280" x2="280" y2="310" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4" />

      <g transform="translate(0, 310)">
        <rect width="560" height="90" rx="3" fill="#1C1B1A" stroke="rgba(255,255,255,0.1)" />
        <text x="20" y="32" fill="#57A773" font-family="monospace" font-size="10">STEP 03 — TELEMETRY RECORDING</text>
        <text x="20" y="60" fill="#FAF8F3" font-family="sans-serif" font-size="14">Capture memory snapshot &amp; distributed trace</text>
        <text x="540" y="48" fill="#A68020" font-family="monospace" font-size="11" text-anchor="end">BUFFER 100%</text>
      </g>

      <!-- Summary footer -->
      <g transform="translate(0, 430)">
        <rect width="560" height="150" rx="3" fill="#161514" />
        <text x="24" y="36" fill="#FAF8F3" font-family="sans-serif" font-size="13" font-weight="600">SLA Performance Target</text>
        <text x="24" y="80" fill="#FAF8F3" font-family="sans-serif" font-size="34" font-weight="bold">99.98% <tspan font-size="14" font-weight="normal" fill="#57A773">Resolution within SLA</tspan></text>
        <path d="M24,115 L140,105 L260,110 L380,95 L530,90" fill="none" stroke="#57A773" stroke-width="2.5" />
      </g>
    </g>
  </g>
</svg>
