<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413" />
      <stop offset="100%" stop-color="#1E1E1C" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A68020" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#388A9E" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bg1)" />
  
  <!-- Subtle Grid Texture -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="480" y1="0" x2="480" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <!-- Window Header -->
  <g transform="translate(80, 70)">
    <rect width="1040" height="610" rx="6" fill="#1A1918" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="1040" height="48" rx="6" fill="#22211F" />
    <circle cx="28" cy="24" r="5" fill="#E05B4C" />
    <circle cx="46" cy="24" r="5" fill="#E5A642" />
    <circle cx="64" cy="24" r="5" fill="#57A773" />
    <text x="520" y="29" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1.5">CYBERLOOP // TELEMETRY ENGINE v2.4</text>
    
    <!-- Left Sidebar Menu -->
    <g transform="translate(24, 70)">
      <rect width="160" height="32" rx="3" fill="rgba(255,255,255,0.06)" />
      <text x="16" y="20" fill="#FAF8F3" font-family="monospace" font-size="11" font-weight="bold">OVERVIEW</text>
      <text x="16" y="60" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">STREAM_LOGS</text>
      <text x="16" y="96" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">LATENCY_MAP</text>
      <text x="16" y="132" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">NODES (12)</text>
      <text x="16" y="168" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">METRICS_CONFIG</text>
    </g>

    <!-- Main Metric Cards -->
    <g transform="translate(208, 70)">
      <!-- Metric 1 -->
      <rect width="256" height="110" rx="4" fill="#232220" stroke="rgba(255,255,255,0.05)" />
      <text x="20" y="32" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" letter-spacing="1">THROUGHPUT</text>
      <text x="20" y="72" fill="#FAF8F3" font-family="sans-serif" font-size="28" font-weight="bold">428.4 <tspan font-size="14" font-weight="normal" fill="#A68020">req/ms</tspan></text>
      <path d="M20,92 Q80,80 140,88 T240,78" fill="none" stroke="#A68020" stroke-width="2" />

      <!-- Metric 2 -->
      <rect x="272" width="256" height="110" rx="4" fill="#232220" stroke="rgba(255,255,255,0.05)" />
      <text x="292" y="32" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" letter-spacing="1">GLOBAL LATENCY</text>
      <text x="292" y="72" fill="#FAF8F3" font-family="sans-serif" font-size="28" font-weight="bold">0.82 <tspan font-size="14" font-weight="normal" fill="#388A9E">ms</tspan></text>
      <path d="M292,92 Q350,96 420,84 T512,86" fill="none" stroke="#388A9E" stroke-width="2" />

      <!-- Metric 3 -->
      <rect x="544" width="264" height="110" rx="4" fill="#232220" stroke="rgba(255,255,255,0.05)" />
      <text x="564" y="32" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10" letter-spacing="1">ERROR RATE</text>
      <text x="564" y="72" fill="#FAF8F3" font-family="sans-serif" font-size="28" font-weight="bold">0.001 <tspan font-size="14" font-weight="normal" fill="#57A773">%</tspan></text>
      <path d="M564,92 Q620,90 700,94 T790,92" fill="none" stroke="#57A773" stroke-width="2" />

      <!-- Graph Area -->
      <g transform="translate(0, 130)">
        <rect width="808" height="360" rx="4" fill="#201F1D" stroke="rgba(255,255,255,0.05)" />
        <text x="24" y="36" fill="#FAF8F3" font-family="sans-serif" font-size="14" font-weight="600">Realtime Distributed Pipeline Flow</text>
        <text x="784" y="36" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" text-anchor="end">LIVE STREAM // BUFFER 99.8%</text>
        
        <!-- Waveform visual -->
        <path d="M40,260 C 140,240 180,140 280,180 C 380,220 440,110 540,160 C 640,210 700,100 770,140" fill="none" stroke="url(#glow1)" stroke-width="3" />
        <path d="M40,260 C 140,240 180,140 280,180 C 380,220 440,110 540,160 C 640,210 700,100 770,140 L 770,320 L 40,320 Z" fill="url(#glow1)" opacity="0.08" />

        <!-- Nodes on curve -->
        <circle cx="280" cy="180" r="5" fill="#FAF8F3" stroke="#A68020" stroke-width="2" />
        <circle cx="540" cy="160" r="5" fill="#FAF8F3" stroke="#388A9E" stroke-width="2" />
        <circle cx="770" cy="140" r="5" fill="#FAF8F3" stroke="#A68020" stroke-width="2" />

        <!-- Terminal log preview -->
        <rect x="24" y="270" width="760" height="64" rx="3" fill="#171615" />
        <text x="40" y="296" fill="#A68020" font-family="monospace" font-size="10">[NODE_EU_CENTRAL]</text>
        <text x="160" y="296" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="10">Cluster synced in 0.41ms · SHA: a4f81c9 · Health status OK</text>
        <text x="40" y="318" fill="#388A9E" font-family="monospace" font-size="10">[SYNC_RESOLVER]</text>
        <text x="160" y="318" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">0 packet loss across 12 distributed regions.</text>
      </g>
    </g>
  </g>
</svg>
