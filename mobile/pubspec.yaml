name: mobile
description: Sailesh P Interactive Portfolio Admin Mobile App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  flutter_secure_storage: ^9.2.1
  shared_preferences: ^2.2.3
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  local_auth: ^3.0.2
  dio: ^5.4.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
